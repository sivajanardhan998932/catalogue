name: Catalogue CI

on:
  push:
    branches:
      - "feature/**"
      - main
  workflow_dispatch:

jobs:
  feature-ci:
    if: startsWith(github.ref, 'refs/heads/feature/')
    uses: sivajanardhan998932/workflows/.github/workflows/nodejs-eks-feature.yaml@main
    with:
      project: roboshop
      component: catalogue

  main-ci:
    if: github.ref == 'refs/heads/main'
    uses: sivajanardhan998932/workflows/.github/workflows/nodejs-eks-main.yaml@main
    with:
      project: roboshop
      component: catalogue
      environment: dev
       # 